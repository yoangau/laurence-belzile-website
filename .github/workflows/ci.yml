# Checks every push and pull request. Uses the small sample content, so it needs no secrets.
name: CI

on:
  push:
    branches-ignore: [master, staging] # those two run the same checks in deploy.yml
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONTENT_FILE: fixtures/content.sample.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
