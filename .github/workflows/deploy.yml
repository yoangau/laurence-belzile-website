# Builds the site from the published content and deploys it to Cloudflare.
#
# Runs when:
#   - Laurence clicks "Publier" in /admin (workflow_dispatch from the Worker), or
#   - code is pushed to master (production) or to the v2 branch (staging, until the cutover).
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (see docs/setup-cloudflare.md).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy was started
        required: false
        default: manual
  push:
    branches: [master, claude/bold-rubin-nurhro]

permissions:
  contents: read

# Publishing twice quickly queues the second deploy instead of running both at once.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Public R2 domain for images and PDFs. Switch to https://media.laurencebelzile.com at cutover.
      PUBLIC_MEDIA_URL: https://lb-media.inscape.xyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the published content
        run: npm run content:pull
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply lb --remote
      - name: Deploy
        run: npx wrangler deploy
