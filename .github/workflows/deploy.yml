# Builds the site from the published content and deploys it to Cloudflare.
#
#   branch    environment   site                  content & media
#   master    production    laurencebelzile.com   lb-content, lb-media (media.laurencebelzile.com)
#   staging   staging       lb.inscape.xyz        lb-content-staging, lb-media-staging (lb-media.inscape.xyz)
#
# Runs when code is pushed to one of those branches, and when "Publier" is clicked in that
# environment's /admin (the Worker starts this workflow, or re-runs its latest run).
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (see docs/setup-cloudflare.md).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy was started
        required: false
        default: manual
  push:
    branches: [master, staging]

permissions:
  contents: read

# One deploy at a time per branch; publishing twice quickly queues the second one.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'master' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Selects `env.staging` in wrangler.jsonc for the build, the content download and the deploy.
      CLOUDFLARE_ENV: ${{ github.ref_name == 'staging' && 'staging' || '' }}
      PUBLIC_MEDIA_URL: ${{ github.ref_name == 'staging' && 'https://lb-media.inscape.xyz' || 'https://media.laurencebelzile.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the published content
        run: npm run content:pull
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote ${CLOUDFLARE_ENV:+--env $CLOUDFLARE_ENV}
      - name: Deploy
        # The build already resolved the environment (CLOUDFLARE_ENV), so no --env here.
        run: npx wrangler deploy
